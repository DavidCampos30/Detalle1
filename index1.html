<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flores Amarillas</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #1a1a2e, #16213e);
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            color: #fff;
            cursor: pointer;
        }

        .container {
            text-align: center;
            z-index: 10;
        }

        h1 {
            font-size: 2.5rem;
            color: #ffd700;
            margin-bottom: 10px;
            text-shadow: 0 0 10px rgba(255, 215, 0, 0.5);
            animation: fadeIn 2s ease-in-out;
        }

        p {
            font-size: 1.2rem;
            color: #e0e0e0;
            margin-bottom: 15px;
            animation: fadeIn 3s ease-in-out;
        }

        /* Estilo para el corazón latiendo */
        .heart {
            font-size: 2rem;
            color: #ff4d4d;
            margin-bottom: 30px;
            display: inline-block;
            animation: heartbeat 1.2s infinite ease-in-out, fadeIn 3s ease-in-out;
            text-shadow: 0 0 10px rgba(255, 77, 77, 0.6);
        }

        @keyframes heartbeat {
            0%, 100% { transform: scale(1); }
            15% { transform: scale(1.25); }
            30% { transform: scale(1); }
            45% { transform: scale(1.15); }
            60% { transform: scale(1); }
        }

        /* Contenedor del Ramo Central / Flores */
        .bouquet {
            position: relative;
            width: 200px;
            height: 300px;
            margin: 0 auto;
        }

        /* Estilo base de cada flor del ramo */
        .flower {
            position: absolute;
            animation: bloom 1s ease-in-out forwards;
            opacity: 0;
            transform: scale(0);
        }

        .flower1 { top: 20px; left: 50px; animation-delay: 0.5s; }
        .flower2 { top: 0px; left: 100px; animation-delay: 0.8s; }
        .flower3 { top: 30px; right: 40px; animation-delay: 1.1s; }
        .flower4 { top: 80px; left: 20px; animation-delay: 1.4s; }
        .flower5 { top: 90px; right: 20px; animation-delay: 1.7s; }

        /* Flores generadas automáticamente o por clic en el fondo */
        .bg-flower, .click-flower {
            position: absolute;
            width: 80px;
            height: 80px;
            pointer-events: none;
            z-index: 1;
        }

        .bg-flower {
            animation: floatUp 6s linear forwards;
            opacity: 0;
        }

        .click-flower {
            width: 100px;
            height: 100px;
            transform: translate(-50%, -50%) scale(0);
            animation: bloomClick 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
            z-index: 100;
        }

        /* Centro de la flor */
        .center {
            width: 30px;
            height: 30px;
            background-color: #5c3a21;
            border-radius: 50%;
            position: absolute;
            top: 35px;
            left: 35px;
            z-index: 2;
        }

        .click-flower .center {
            top: 35px;
            left: 35px;
        }

        /* Pétalos */
        .petals {
            position: relative;
            width: 100px;
            height: 100px;
        }

        .petal {
            position: absolute;
            width: 35px;
            height: 55px;
            background: linear-gradient(to top, #ffcc00, #ffee55);
            border-radius: 50% 50% 20% 20%;
            top: 15px;
            left: 32px;
            transform-origin: bottom center;
        }

        .petal:nth-child(1) { transform: rotate(0deg); }
        .petal:nth-child(2) { transform: rotate(45deg); }
        .petal:nth-child(3) { transform: rotate(90deg); }
        .petal:nth-child(4) { transform: rotate(135deg); }
        .petal:nth-child(5) { transform: rotate(180deg); }
        .petal:nth-child(6) { transform: rotate(225deg); }
        .petal:nth-child(7) { transform: rotate(270deg); }
        .petal:nth-child(8) { transform: rotate(315deg); }

        /* Tallos del ramo central */
        .stem {
            position: absolute;
            width: 6px;
            height: 180px;
            background-color: #4CAF50;
            top: 90px;
            left: 97px;
            z-index: -1;
            border-radius: 3px;
        }

        /* Animaciones */
        @keyframes bloom {
            0% { transform: scale(0); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        @keyframes bloomClick {
            0% { transform: translate(-50%, -50%) scale(0) rotate(0deg); opacity: 0; }
            100% { transform: translate(-50%, -50%) scale(1) rotate(15deg); opacity: 1; }
        }

        @keyframes floatUp {
            0% {
                transform: translateY(100vh) scale(0.3) rotate(0deg);
                opacity: 0;
            }
            20% {
                opacity: 0.8;
            }
            80% {
                opacity: 0.8;
            }
            100% {
                transform: translateY(-100px) scale(1) rotate(360deg);
                opacity: 0;
            }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>¡Tus flores amarillas!</h1>
        <p>Haz clic en cualquier parte de la pantalla.</p>
        <div class="heart">❤️</div>

        <div class="bouquet">
            <div class="stem" style="height: 190px; transform: rotate(-5deg);"></div>
            <div class="stem" style="height: 200px; transform: rotate(5deg);"></div>
            <div class="stem" style="height: 170px; transform: rotate(0deg);"></div>

            <!-- Flor 1 -->
            <div class="flower flower1">
                <div class="center"></div>
                <div class="petals">
                    <div class="petal"></div><div class="petal"></div><div class="petal"></div><div class="petal"></div>
                    <div class="petal"></div><div class="petal"></div><div class="petal"></div><div class="petal"></div>
                </div>
            </div>
            <!-- Flor 2 -->
            <div class="flower flower2">
                <div class="center"></div>
                <div class="petals">
                    <div class="petal"></div><div class="petal"></div><div class="petal"></div><div class="petal"></div>
                    <div class="petal"></div><div class="petal"></div><div class="petal"></div><div class="petal"></div>
                </div>
            </div>
            <!-- Flor 3 -->
            <div class="flower flower3">
                <div class="center"></div>
                <div class="petals">
                    <div class="petal"></div><div class="petal"></div><div class="petal"></div><div class="petal"></div>
                    <div class="petal"></div><div class="petal"></div><div class="petal"></div><div class="petal"></div>
                </div>
            </div>
            <!-- Flor 4 -->
            <div class="flower flower4">
                <div class="center"></div>
                <div class="petals">
                    <div class="petal"></div><div class="petal"></div><div class="petal"></div><div class="petal"></div>
                    <div class="petal"></div><div class="petal"></div><div class="petal"></div><div class="petal"></div>
                </div>
            </div>
            <!-- Flor 5 -->
            <div class="flower flower5">
                <div class="center"></div>
                <div class="petals">
                    <div class="petal"></div><div class="petal"></div><div class="petal"></div><div class="petal"></div>
                    <div class="petal"></div><div class="petal"></div><div class="petal"></div><div class="petal"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Función para crear flores flotantes automáticas en el fondo
        function createBackgroundFlower() {
            const flower = document.createElement('div');
            flower.classList.add('bg-flower');
            
            // Posición horizontal aleatoria
            flower.style.left = Math.random() * window.innerWidth + 'px';
            
            // Tamaño y velocidad ligeramente aleatorios para mayor naturalidad
            const size = Math.random() * 40 + 50; // entre 50px y 90px
            flower.style.width = size + 'px';
            flower.style.height = size + 'px';
            
            const duration = Math.random() * 3 + 5; // entre 5 y 8 segundos
            flower.style.animationDuration = duration + 's';

            flower.innerHTML = `
                <div class="center" style="width: ${size*0.3}px; height: ${size*0.3}px; top: ${size*0.35}px; left: ${size*0.35}px;"></div>
                <div class="petals" style="width: ${size}px; height: ${size}px;">
                    <div class="petal" style="width: ${size*0.35}px; height: ${size*0.55}px; top: ${size*0.15}px; left: ${size*0.32}px;"></div>
                    <div class="petal" style="width: ${size*0.35}px; height: ${size*0.55}px; top: ${size*0.15}px; left: ${size*0.32}px; transform: rotate(45deg); transform-origin: bottom center;"></div>
                    <div class="petal" style="width: ${size*0.35}px; height: ${size*0.55}px; top: ${size*0.15}px; left: ${size*0.32}px; transform: rotate(90deg); transform-origin: bottom center;"></div>
                    <div class="petal" style="width: ${size*0.35}px; height: ${size*0.55}px; top: ${size*0.15}px; left: ${size*0.32}px; transform: rotate(135deg); transform-origin: bottom center;"></div>
                    <div class="petal" style="width: ${size*0.35}px; height: ${size*0.55}px; top: ${size*0.15}px; left: ${size*0.32}px; transform: rotate(180deg); transform-origin: bottom center;"></div>
                    <div class="petal" style="width: ${size*0.35}px; height: ${size*0.55}px; top: ${size*0.15}px; left: ${size*0.32}px; transform: rotate(225deg); transform-origin: bottom center;"></div>
                    <div class="petal" style="width: ${size*0.35}px; height: ${size*0.55}px; top: ${size*0.15}px; left: ${size*0.32}px; transform: rotate(270deg); transform-origin: bottom center;"></div>
                    <div class="petal" style="width: ${size*0.35}px; height: ${size*0.55}px; top: ${size*0.15}px; left: ${size*0.32}px; transform: rotate(315deg); transform-origin: bottom center;"></div>
                </div>
            `;

            document.body.appendChild(flower);

            setTimeout(() => {
                flower.remove();
            }, duration * 1000);
        }

        // Generar una flor nueva cada 600 milisegundos de forma continua
        setInterval(createBackgroundFlower, 600);

        // Mantener la interacción al hacer clic en la pantalla
        document.body.addEventListener('click', (e) => {
            const x = e.clientX;
            const y = e.clientY;

            const flower = document.createElement('div');
            flower.classList.add('click-flower');
            flower.style.left = `${x}px`;
            flower.style.top = `${y}px`;

            flower.innerHTML = `
                <div class="center"></div>
                <div class="petals">
                    <div class="petal"></div><div class="petal"></div><div class="petal"></div><div class="petal"></div>
                    <div class="petal"></div><div class="petal"></div><div class="petal"></div><div class="petal"></div>
                </div>
            `;

            document.body.appendChild(flower);

            setTimeout(() => {
                flower.remove();
            }, 5000);
        });
    </script>

</body>
</html>
